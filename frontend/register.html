<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Unique Beats</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos principales -->
    <link rel="stylesheet" href="styles.css">
       
    </style>
</head>

<body>

    <main class="register-section">

        <div class="register-card">

            <div class="register-header">
                <p class="register-kicker">Unique Beats</p>

                <h1>Crear cuenta</h1>

                <p>
                    Únete a Unique Beats y descubre nuestro sonido.
                </p>
            </div>

            <form id="registerForm" class="register-form">

                <!-- Usuario -->
                <div class="input-group">
                    <label for="usuario">Usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Tu usuario"
                        required>
                </div>

                <!-- Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required>
                </div>

                <!-- Tipo de usuario -->
                <div class="input-group">
                    <label for="tipo">Tipo de usuario</label>

                    <select id="tipo" name="tipo">
                        <option value="usuario">Usuario</option>
                    </select>
                </div>

                <button type="submit" class="btn-register">
                    <i class="fa-solid fa-user-plus"></i>
                    Crear cuenta
                </button>

            </form>

            <div id="mensaje"></div>

            <div class="login-link">
                ¿Ya tienes una cuenta?
                <a href="login.html">Iniciar sesión</a>
            </div>

        </div>

    </main>

    <script src="register.js"></script>

</body>

</html>
