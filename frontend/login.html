<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Unique Beats</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS principal -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <section class="login-section">

        <div class="login-card">

            <div class="login-header">

                <p class="login-kicker">Acceso</p>

                <h2>Iniciar sesión</h2>

            </div>


            <form class="login-form" id="loginForm">

                <div class="input-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Tu usuario"
                        required>

                </div>


                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required>

                </div>


                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            name="remember">

                        <span>Recordarme</span>

                    </label>


                    <a
                        href="#"
                        class="forgot-password">

                        Olvidé mi contraseña

                    </a>

                </div>


                <button
                    type="submit"
                    class="btn-login">

                    <i class="fa-solid fa-right-to-bracket"></i>
                    Entrar

                </button>

                <p
                    id="loginMessage"
                    class="login-message">
                </p>

            </form>

            <div class="login-link">
                ¿No tienes una cuenta?
                <a href="register.html">Crear cuenta</a>
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
